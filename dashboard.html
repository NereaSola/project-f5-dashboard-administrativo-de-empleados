<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Contactos</title>
    <link rel="stylesheet" href="./src/sass/style.scss">
</head>
<body>

    <div class="container">
        <div class="alphabet-filter">
            <span class="letter active">A</span>
            <span class="letter">B</span>
            <span class="letter">C</span>
            <span class="letter">D</span>
            <span class="letter">E</span>
            <span class="letter">F</span>
            <span class="letter">G</span>
            <span class="letter">H</span>
            <span class="letter">I</span>
            <span class="letter">J</span>
            <span class="letter">K</span>
            <span class="letter">L</span>
            <span class="letter">M</span>
        </div>

        <hr class="divider">

        <div class="cards-grid">
            <div class="card">
                <div class="avatar-container">
                    <img src="https://via.placeholder.com/150" alt="Elena Rodríguez" class="avatar">
                </div>
                <h3 class="name">Elena Rodríguez</h3>
            </div>

            <div class="card">
                <div class="avatar-container">
                    <img src="https://via.placeholder.com/150" alt="Marco Valenzuela" class="avatar">
                </div>
                <h3 class="name">Marco Valenzuela</h3>
            </div>

            <div class="card">
                <div class="avatar-container">
                    <img src="https://via.placeholder.com/150" alt="Sofía Méndez" class="avatar">
                </div>
                <h3 class="name">Sofía Méndez</h3>
            </div>

            <div class="card">
                <div class="avatar-container">
                    <img src="https://via.placeholder.com/150" alt="Javier Santos" class="avatar">
                </div>
                <h3 class="name">Javier Santos</h3>
            </div>

            <div class="card">
                <div class="avatar-container">
                    <img src="https://via.placeholder.com/150" alt="Lucía Navarro" class="avatar">
                </div>
                <h3 class="name">Lucía Navarro</h3>
            </div>
        </div>
    </div>
<!-- <script type="module" src="./src/js/events/btnloginevent.js"></script> -->
</body>
</html>
